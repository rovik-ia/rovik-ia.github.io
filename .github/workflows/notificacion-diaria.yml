name: Aviso diario del informe

on:
  push:
    branches: [main]
    paths: ["reports/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Enviar resumen a WhatsApp
        run: python3 scripts/notify_whatsapp.py
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PHONE_ID: ${{ secrets.META_PHONE_ID }}
          META_TEMPLATE: ${{ vars.META_TEMPLATE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
