name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Fotos de cabecera para guías nuevas (Pexels)
        run: |
          pip install -q pillow certifi
          npx tsx scripts/export-articles.ts
          python3 scripts/fetch_photos.py --missing
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - run: npm run build
        env:
          NEXT_PUBLIC_AMAZON_TAG: ${{ vars.AMAZON_TAG }}
      - name: Endurecer la web compilada (CSP por página y CNAME)
        run: python3 scripts/postbuild.py
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
