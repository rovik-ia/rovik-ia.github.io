name: Vídeo diario para redes

on:
  push:
    branches: [main]
    paths: ["lib/articles/**"]
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug concreto (vacío = la guía más reciente)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: video-diario
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pillow certifi imageio-ffmpeg edge-tts

      - name: Reutilizar el B-roll ya descargado
        uses: actions/cache@v4
        with:
          path: marketing/broll
          key: broll-${{ github.run_id }}
          restore-keys: broll-

      - name: Descargar y fijar las imágenes de la guía nueva
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          pip install --quiet pillow certifi
          npx tsx scripts/export-articles.ts
          python3 scripts/fetch_photos.py --missing

      - name: Guardar las imágenes en el repositorio
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add public/img lib/photoCredits.json
          if git diff --cached --quiet; then
            echo "No hay imágenes nuevas que guardar."
          else
            git commit -m "Imágenes de la guía del día"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Generar el vídeo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TTS_ENGINE: edge
        run: |
          npx tsx scripts/export-articles.ts
          if [ -n "${{ inputs.slug }}" ]; then
            python3 scripts/make_videos.py "${{ inputs.slug }}"
          else
            python3 scripts/make_videos.py --latest
          fi
          ls -lh marketing/videos/

      - name: Publicar el vídeo como archivo público
        id: archivo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(ls marketing/videos/*.mp4 | head -1)
          SLUG=$(basename "$V" .mp4)
          TAG="video-$(date +%Y%m%d)-$SLUG"
          gh release create "$TAG" "$V" --title "Vídeo $(date +%d/%m/%Y)" \
            --notes "Vídeo vertical de la guía $SLUG." 2>/dev/null \
            || gh release upload "$TAG" "$V" --clobber
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "ruta=$V" >> $GITHUB_OUTPUT
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/$SLUG.mp4" >> $GITHUB_OUTPUT

      - name: Publicar en YouTube Shorts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACIDAD: ${{ vars.YOUTUBE_PRIVACIDAD }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
        run: python3 scripts/publish_youtube.py "${{ steps.archivo.outputs.ruta }}"

      - name: Publicar en Instagram Reels
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/publish_instagram.py "${{ steps.archivo.outputs.ruta }}" "${{ steps.archivo.outputs.slug }}" "${{ steps.archivo.outputs.url }}"

      - name: Enviar el vídeo por Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for v in marketing/videos/*.mp4; do
            python3 scripts/send_video_telegram.py "$v"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: marketing/videos/*
          retention-days: 30
